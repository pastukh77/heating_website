<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея - ТОВ «ТЕР АЛЬТЕНЕРГО»</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <style>
        :root { --primary-color: #00BCD4; --secondary-color: #0097A7; }
        .header { background: linear-gradient(135deg, var(--primary-color) 0%, #26C6DA 100%); }
        .nav-link:hover, .nav-link.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .btn { background-color: var(--primary-color); }
        .btn:hover { background-color: #0097A7; }
        .info-box { border-left-color: var(--primary-color); }
        
        body { display: flex; flex-direction: column; }
        @media (min-width: 769px) {
            .layout--sidebar { display: flex; }
            .nav--sidebar { position: fixed; left: 0; top: 0; width: 220px; height: 100vh; flex-direction: column; border-bottom: none; border-right: 3px solid #E0E0E0; background: #f8f9fa; z-index: 100; }
            .nav--sidebar .nav-list { flex-direction: column; padding-top: 80px; }
            .nav--sidebar .nav-item { max-width: none; }
            .nav--sidebar .nav-link { text-align: left; padding: 1rem 1.5rem; border-bottom: none; border-left: 4px solid transparent; }
            .nav--sidebar .nav-link:hover, .nav--sidebar .nav-link.active { border-left-color: var(--primary-color); background: #fff; }
            .header--sidebar { margin-left: 220px; text-align: left; padding-left: 2rem; }
            .main { margin-left: 220px; }
            .main .container { max-width: none; width: 100%; padding-right: 2rem; }
            .footer { margin-left: 220px; }
            .pdf-viewer { width: 100%; }
            .gallery { width: 100%; }
            .gallery-item img { max-width: 100%; }
        }
        .info-box { border-left: 4px solid var(--primary-color); }
        .section-header { background: none; color: var(--primary-color); border-left: 4px solid var(--primary-color); padding-left: 1rem; }
        
    </style>
</head>
<body>
    <header class="header header--sidebar">
        <h1>ТОВ «ТЕР АЛЬТЕНЕРГО»</h1>
    </header>
    <nav class="nav nav--sidebar">
        <ul class="nav-list">
            <li class="nav-item"><a href="/ter-altenergo/" class="nav-link"><span class="nav-icon">🏠</span>Головна</a></li>
            <li class="nav-item"><a href="/ter-altenergo/news/" class="nav-link"><span class="nav-icon">📰</span>Новини</a></li>
            <li class="nav-item"><a href="/ter-altenergo/documents/" class="nav-link"><span class="nav-icon">📄</span>Документи</a></li>
            <li class="nav-item"><a href="/ter-altenergo/gallery/" class="nav-link active"><span class="nav-icon">📸</span>Фотогалерея</a></li>
            <li class="nav-item"><a href="/ter-altenergo/contacts/" class="nav-link"><span class="nav-icon">📞</span>Контакти</a></li>
        </ul>
    </nav>
    <main class="main layout--sidebar">
        <div class="container">
            <h2 class="section-header">📸 Фотогалерея</h2>
            <div class="gallery">
                <div class="info-box"><p>Фотографії будуть додані найближчим часом.</p></div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p>&copy; 2026 ТОВ «ТЕР АЛЬТЕНЕРГО». Всі права захищено.</p>
    </footer>
</body>
</html>
