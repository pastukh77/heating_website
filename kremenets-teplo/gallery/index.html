<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фотогалерея - ТОВ «КРЕМЕНЕЦЬ ТЕПЛО»</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <style>
        :root { --primary-color: #9C27B0; --secondary-color: #7B1FA2; }
        .header { background: linear-gradient(135deg, var(--primary-color) 0%, #AB47BC 100%); }
        .nav-link:hover, .nav-link.active { color: var(--primary-color); border-bottom-color: var(--primary-color); }
        .btn { background-color: var(--primary-color); }
        .btn:hover { background-color: #7B1FA2; }
        .info-box { border-left-color: var(--primary-color); }
        
        .header--corporate { background: linear-gradient(180deg, var(--primary-color) 0%, var(--primary-color) 100%); padding: 1.2rem 0; text-align: left; }
        .header--corporate h1 { max-width: 1200px; margin: 0 auto; padding: 0 1rem; font-size: 1.6rem; }
        .nav--corporate { background: #2c2c2c; border-bottom: 4px solid var(--primary-color); }
        .nav--corporate .nav-list { justify-content: flex-start; }
        .nav--corporate .nav-link { color: #fff; padding: 1rem 1.5rem; }
        .nav--corporate .nav-link:hover, .nav--corporate .nav-link.active { background: var(--primary-color); }
        .nav--corporate .nav-icon { display: inline; margin-right: 8px; font-size: 1rem; }
        .info-box { border-radius: 5px; border-left: 4px solid var(--primary-color); }
        .nav-card { border-radius: 5px; border-top: 4px solid var(--primary-color); }
        .section-header { background: var(--primary-color); border-radius: 0; }
        .footer { background: #2c2c2c; color: #fff; }
        .footer p { color: #ccc; }
        
    </style>
</head>
<body>
    <header class="header header--corporate">
        <h1>ТОВ «КРЕМЕНЕЦЬ ТЕПЛО»</h1>
    </header>
    <nav class="nav nav--corporate">
        <ul class="nav-list">
            <li class="nav-item"><a href="/kremenets-teplo/" class="nav-link"><span class="nav-icon">🏠</span>Головна</a></li>
            <li class="nav-item"><a href="/kremenets-teplo/news/" class="nav-link"><span class="nav-icon">📰</span>Новини</a></li>
            <li class="nav-item"><a href="/kremenets-teplo/documents/" class="nav-link"><span class="nav-icon">📄</span>Документи</a></li>
            <li class="nav-item"><a href="/kremenets-teplo/gallery/" class="nav-link active"><span class="nav-icon">📸</span>Фотогалерея</a></li>
            <li class="nav-item"><a href="/kremenets-teplo/contacts/" class="nav-link"><span class="nav-icon">📞</span>Контакти</a></li>
        </ul>
    </nav>
    <main class="main ">
        <div class="container">
            <h2 class="section-header">📸 Фотогалерея</h2>
            <div class="gallery">
                <div class="gallery-item"><img src="/kremenets-teplo/photos/Кременець1.jpg" alt="Кременець1.jpg" loading="lazy"></div>
            </div>
        </div>
    </main>
    <footer class="footer">
        <p>&copy; 2026 ТОВ «КРЕМЕНЕЦЬ ТЕПЛО». Всі права захищено.</p>
    </footer>
</body>
</html>
